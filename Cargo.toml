[package]
edition = "2024"
authors = ["Francisco A. B. Sampaio <franciscoabsampaio@gmail.com>"]
name = "spark-connect"
version = "0.2.3"
description = "Rust client for Apache Spark Connect."
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/spark-connect"
repository = "https://github.com/franciscoabsampaio/spark-connect"
homepage = "https://github.com/franciscoabsampaio/spark-connect"
keywords = ["spark", "connect", "sql", "data", "client"]
categories = ["api-bindings", "database"]

[dependencies]
api-parity-rs = { version = "0.0.3", optional = true, features = ["serde"] }
arrow = { version = "56.2.0", default-features = false, features = ["ipc"] }
arrow-schema = "56.2.0"
chrono = { version = "0.4.42", optional = true }
futures-util = "0.3.31"
http = "1.3.1"
http-body = "1.0.1"
polars = { version = "0.54.4", default-features = false, features = ["ipc_streaming"] }
prost = "0.14.1"
prost-types = "0.14.1"
regex = "1.11.3"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14.2" }
tonic-prost = "0.14.2"
tower = "0.5.2"
tracing = "0.1.44"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14.2"
protoc-bin-vendored = "3"
walkdir = "2.3.2"

[dev-dependencies]
tokio-test = "0.4.4"

[[example]]
name = "databricks"
required-features = ["tokio-macros", "tls"]

[[bin]]
name = "api-parity-dump"
required-features = ["parity"]

[features]
default = [
  "parity",
  "spark-3-5",
  "tonic/default",
  "tls"
]
chrono = [
    "chrono/default"
]
tokio-macros = [
  "tokio/macros",
]
tls = [
  "tonic/tls-connect-info",
  "tonic/_tls-any",
  "tonic/tls-ring",
  "tonic/tls-native-roots"
]
# Spark Versions
parity = [
  "api-parity-rs"
]
spark-3-4 = []
spark-3-5 = []

[profile.release]
codegen-units = 1 # Improves optimizations
lto = true
opt-level = "z"   # "z" for size, "3" for maximum performance
panic = "abort"   # Abort on panic instead of unwinding - smaller binaries and slightly faster
